[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Keep the default run fast and CPU-only: `slow` is excluded unless asked for.
# A command-line -m replaces the one below, so `pytest -m slow` works.
#   pytest                          -> fast unit tests + smoke
#   pytest -m "physics"             -> invariants (energy, Fresnel, reciprocity)
#   pytest -m slow                  -> long convergence sweeps and full reference sweeps
#   pytest -m reference             -> validation against external solvers
addopts =
    -ra
    --strict-markers
    -m "not slow"

markers =
    reference: validation against an external solver (see tests/reference_cases/)
    slow: takes more than a few seconds (high fto, convergence sweeps, fits)
    physics: asserts a physical invariant rather than an implementation detail
    equivalence: cross-checks two formulations that must agree
    backend_consistency: numpy vs jax vs torch
    autodiff: needs a differentiable backend (jax or torch)
    jax: needs jax
    torch: needs torch
    gpu: needs a CUDA device
    regression: compares against stored golden values in tests/data
    plotting: needs matplotlib
