name: Pytest

on:
  push:
  pull_request:
  workflow_dispatch:

# The test job only needs to read the checked-out repository.
permissions:
  contents: read

# When another commit is pushed to the same branch, stop its older test run.
concurrency:
  group: pytest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # For a push, this checks out that pushed commit. For a pull request, it
      # checks the pull request as GitHub would merge it into the target branch.
      - name: Check out the tested commit
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: setup.py

      - name: Install the package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.0"
          python -m pip install --editable ".[pytorch]" pytest

      # pytest.ini points pytest at tests/ and excludes tests marked "slow".
      # Future tests/test_*.py files are discovered automatically.
      - name: Run the fast test suite
        run: python -m pytest
